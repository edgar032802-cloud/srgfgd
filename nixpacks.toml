# Railway(Nixpacks) 빌드 설정.
#
# 기본값은 설치 단계에서 `npm ci` 를 돌린다. 그런데 `npm ci` 는 설치 전에
# **node_modules 를 통째로 지운다** — 그것이 `npm install` 과의 결정적 차이다.
# 한편 Nixpacks 는 빌드를 빠르게 하려고 `node_modules/.cache` 자리에 캐시를
# 마운트해 둔다. 마운트된 디렉터리는 지울 수 없으므로 그 rmdir 이 실패한다:
#
#     npm error code EBUSY
#     npm error syscall rmdir
#     npm error path /app/node_modules/.cache
#
# 우리 코드가 무엇을 지워서 생긴 일이 아니다(지우는 스크립트는 없다).
# `npm ci` 가 캐시 마운트를 지우려 든 것이다. 그래서 설치 단계만 `npm install`
# 로 바꾼다 — 이쪽은 node_modules 를 비우지 않고 필요한 것만 맞춰 넣는다.
# package-lock.json 이 저장소에 있으므로 설치되는 버전은 그대로 고정된다.

# `--include=dev` 는 빠뜨리면 안 된다. 화면을 굽는 vite 가 devDependencies 에
# 있는데, 배포 환경은 NODE_ENV=production 을 켜 두는 경우가 많고 그러면 npm 이
# devDependencies 를 건너뛴다 — 설치는 성공하고 다음 줄에서 "vite: not found" 로
# 죽는다. 런타임(`npm start`)은 express 와 dotenv 만 쓰므로 남아 있어도 무해하다.

[phases.install]
cmds = ["npm install --include=dev --no-audit --no-fund"]
